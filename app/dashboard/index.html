<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Churn Sense</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #080b12;
    --surface:   #0d1220;
    --surface2:  #131928;
    --border:    #1e2d45;
    --accent:    #00e5ff;
    --accent2:   #ff3d6b;
    --accent3:   #7b61ff;
    --text:      #e2e8f0;
    --muted:     #4a5a72;
    --success:   #00e096;
    --warning:   #ffb547;
    --danger:    #ff3d6b;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  #root { position: relative; z-index: 1; }

  /* Layout */
  .shell { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 220px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 28px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    flex-shrink: 0;
  }

  .sidebar-logo {
    padding: 0 24px 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .sidebar-logo h1 {
    font-family: var(--font-head);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--accent);
    text-transform: uppercase;
    line-height: 1.2;
  }

  .sidebar-logo span {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    border-left: 2px solid transparent;
    transition: all 0.2s;
    font-family: var(--font-mono);
  }

  .nav-item:hover { color: var(--text); background: rgba(0,229,255,0.04); }

  .nav-item.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: rgba(0,229,255,0.06);
  }

  .nav-icon { font-size: 16px; width: 20px; text-align: center; }

  .sidebar-stats {
    margin-top: auto;
    padding: 20px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .stat-pill {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .stat-pill-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .stat-pill-value { font-size: 13px; color: var(--accent); font-weight: 500; }

  /* Main content */
  .main { flex: 1; padding: 40px 48px; overflow-y: auto; }

  .page-header {
    margin-bottom: 36px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .page-title {
    font-family: var(--font-head);
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
  }

  .page-title span { color: var(--accent); }

  .page-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* KPI Cards */
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
  }

  .kpi-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .kpi-card.accent::after  { background: var(--accent); }
  .kpi-card.danger::after  { background: var(--danger); }
  .kpi-card.success::after { background: var(--success); }
  .kpi-card.warning::after { background: var(--warning); }

  .kpi-label { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
  .kpi-value { font-family: var(--font-head); font-size: 28px; font-weight: 700; line-height: 1; }
  .kpi-sub   { font-size: 10px; color: var(--muted); margin-top: 4px; }

  /* Grid layouts */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 24px; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
  }

  .card-title {
    font-family: var(--font-head);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: var(--accent);
    border-radius: 2px;
    display: inline-block;
  }

  /* Table */
  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }

  thead tr { border-bottom: 1px solid var(--border); }

  th {
    text-align: left;
    padding: 10px 12px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
    white-space: nowrap;
  }

  td { padding: 10px 12px; border-bottom: 1px solid rgba(30,45,69,0.5); }

  tbody tr { transition: background 0.15s; cursor: pointer; }
  tbody tr:hover { background: rgba(0,229,255,0.04); }

  .msno-cell {
    font-size: 11px;
    color: var(--muted);
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .badge-critical { background: rgba(255,61,107,0.15); color: var(--danger);  border: 1px solid rgba(255,61,107,0.3); }
  .badge-high     { background: rgba(255,181,71,0.15); color: var(--warning); border: 1px solid rgba(255,181,71,0.3); }
  .badge-medium   { background: rgba(123,97,255,0.15); color: var(--accent3); border: 1px solid rgba(123,97,255,0.3); }
  .badge-low      { background: rgba(0,224,150,0.15);  color: var(--success); border: 1px solid rgba(0,224,150,0.3); }

  /* Progress bar */
  .prob-bar { display: flex; align-items: center; gap: 8px; }
  .prob-track { flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .prob-fill  { height: 100%; border-radius: 2px; transition: width 0.3s; }

  /* Filters */
  .filters {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    align-items: center;
    flex-wrap: wrap;
  }

  select, input[type="text"], input[type="number"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--font-mono);
    outline: none;
    transition: border-color 0.2s;
  }

  select:focus, input:focus { border-color: var(--accent); }

  /* Buttons */
  .btn {
    padding: 8px 20px;
    border-radius: 6px;
    border: none;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: var(--font-mono);
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }

  .btn-primary:hover { background: #33eaff; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

  /* Explanation panel */
  .explain-panel {
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 24px;
    margin-top: 24px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .explain-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }

  .explain-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .explain-text {
    font-size: 13px;
    line-height: 1.8;
    color: var(--text);
  }

  .action-box {
    background: rgba(0,224,150,0.08);
    border: 1px solid rgba(0,224,150,0.25);
    border-radius: 6px;
    padding: 16px;
    margin-top: 16px;
  }

  .action-name {
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    color: var(--success);
    margin-bottom: 6px;
  }

  .action-just { font-size: 12px; color: var(--muted); line-height: 1.6; }

  .shap-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(30,45,69,0.5);
    font-size: 11px;
  }

  .shap-row:last-child { border-bottom: none; }
  .shap-feat { flex: 1; color: var(--text); }
  .shap-val  { font-family: var(--font-mono); font-size: 11px; width: 60px; text-align: right; }
  .shap-dir-up   { color: var(--danger); }
  .shap-dir-down { color: var(--success); }

  /* Bar chart */
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }

  .bar-row { display: flex; align-items: center; gap: 12px; font-size: 11px; }
  .bar-label { width: 160px; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .bar-track  { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .bar-fill   { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent3), var(--accent)); transition: width 0.6s ease; }
  .bar-val    { width: 50px; color: var(--accent); font-size: 11px; }

  /* Donut */
  .donut-wrap { display: flex; align-items: center; gap: 24px; }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-item  { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .legend-dot   { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Monitoring */
  .drift-status {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 24px;
    background: var(--surface2);
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-dot.ok      { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .status-dot.warn    { background: var(--warning); box-shadow: 0 0 8px var(--warning); animation: pulse 1.5s infinite; }
  .status-dot.danger  { background: var(--danger);  box-shadow: 0 0 8px var(--danger);  animation: pulse 1.5s infinite; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .drift-label { font-size: 13px; font-weight: 500; }
  .drift-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .retrain-btn {
    margin-left: auto;
    padding: 8px 20px;
    background: rgba(255,61,107,0.1);
    border: 1px solid rgba(255,61,107,0.4);
    color: var(--danger);
    border-radius: 6px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: var(--font-mono);
    transition: all 0.2s;
  }

  .retrain-btn:hover { background: rgba(255,61,107,0.2); }

  /* Histogram */
  .hist-wrap { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding: 0 4px; }
  .hist-bar  { flex: 1; border-radius: 3px 3px 0 0; background: var(--accent3); opacity: 0.8; transition: opacity 0.2s; min-width: 4px; }
  .hist-bar:hover { opacity: 1; }

  /* Loading */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 40px;
    color: var(--muted);
    font-size: 12px;
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 60px; color: var(--muted); font-size: 12px; }

  /* Pagination */
  .pagination { display: flex; align-items: center; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  .page-btn {
    padding: 4px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-family: var(--font-mono);
    transition: all 0.15s;
  }
  .page-btn:hover { border-color: var(--accent); color: var(--accent); }
  .page-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .page-info { font-size: 11px; color: var(--muted); }

  /* Uplift chart */
  .uplift-dist { display: flex; flex-direction: column; gap: 8px; }
  .uplift-row  { display: flex; align-items: center; gap: 10px; font-size: 11px; }
  .uplift-label { width: 100px; color: var(--muted); text-align: right; font-size: 10px; }
  .uplift-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .uplift-fill-pos { height: 100%; background: var(--success); border-radius: 3px; }
  .uplift-fill-neg { height: 100%; background: var(--danger);  border-radius: 3px; }
  .uplift-count { width: 40px; color: var(--muted); font-size: 10px; }

  .scrollable { max-height: 340px; overflow-y: auto; }
  .scrollable::-webkit-scrollbar { width: 4px; }
  .scrollable::-webkit-scrollbar-track { background: var(--surface2); }
  .scrollable::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

const API = 'http://127.0.0.1:8000';

// ── Helpers ───────────────────────────────────────────────────────────────────

function fmt(n, decimals=1) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toFixed(decimals);
}

function fmtPct(n) {
  if (n == null || isNaN(n)) return '—';
  return (Number(n) * 100).toFixed(1) + '%';
}

function fmtNum(n) {
  if (n == null) return '—';
  return Number(n).toLocaleString();
}

function probColor(p) {
  if (p >= 0.8) return '#ff3d6b';
  if (p >= 0.65) return '#ffb547';
  return '#00e096';
}

function RiskBadge({ tier }) {
  const t = (tier || '').toLowerCase();
  return <span className={`badge badge-${t}`}>{tier || '—'}</span>;
}

function ProbBar({ value }) {
  const pct = Math.round((value || 0) * 100);
  return (
    <div className="prob-bar">
      <div className="prob-track" style={{width: 80}}>
        <div className="prob-fill" style={{width: `${pct}%`, background: probColor(value)}} />
      </div>
      <span style={{fontSize: 11, color: probColor(value), fontWeight: 500}}>{pct}%</span>
    </div>
  );
}

// ── Data loading ──────────────────────────────────────────────────────────────

async function loadCSV(filename, maxRows = 2000) {
  try {
    const resp = await fetch(`/data/${filename}`);
    const text = await resp.text();
    return new Promise(resolve => {
      Papa.parse(text, {
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        preview: maxRows,
        complete: r => resolve(r.data),
      });
    });
  } catch { return []; }
}

// ══════════════════════════════════════════════════════════════════════════════
// PAGE 1 — ACTION PLAN
// ══════════════════════════════════════════════════════════════════════════════

function ActionPlan({ scored, features }) {
  const [tierFilter,   setTierFilter]   = useState('All');
  const [cohortFilter, setCohortFilter] = useState('All');
  const [page,         setPage]         = useState(0);
  const [searchMsno,   setSearchMsno]   = useState('');
  const [loading,      setLoading]      = useState(false);
  const [explanation,  setExplanation]  = useState(null);
  const [selectedMsno, setSelectedMsno] = useState('');
  const PAGE_SIZE = 10;

  // Merge scored + features
  const merged = useMemo(() => {
    if (!scored.length) return [];
    const featMap = {};
    features.forEach(f => { featMap[f.msno] = f; });
    return scored
      .filter(u => u.churn_flag === 1 || u.churn_flag === true)
      .map(u => ({ ...u, ...(featMap[u.msno] || {}) }))
      .sort((a, b) => b.churn_prob - a.churn_prob);
  }, [scored, features]);

  const tiers   = useMemo(() => ['All', ...new Set(merged.map(u => u.risk_tier).filter(Boolean))], [merged]);
  const cohorts = useMemo(() => ['All', ...new Set(merged.map(u => u.behavioral_cohort).filter(Boolean))], [merged]);

  const filtered = useMemo(() => {
    let d = merged;
    if (tierFilter   !== 'All') d = d.filter(u => u.risk_tier === tierFilter);
    if (cohortFilter !== 'All') d = d.filter(u => u.behavioral_cohort === cohortFilter);
    return d;
  }, [merged, tierFilter, cohortFilter]);

  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  const pageData   = filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

  const tierCounts = useMemo(() => {
    const c = {};
    merged.forEach(u => { c[u.risk_tier] = (c[u.risk_tier] || 0) + 1; });
    return c;
  }, [merged]);

  const actionCounts = useMemo(() => {
    const c = {};
    scored.forEach(u => {
      const a = u.final_action || 'no_action';
      c[a] = (c[a] || 0) + 1;
    });
    return Object.entries(c).sort((a,b) => b[1]-a[1]);
  }, [scored]);

  const persuadable = useMemo(() =>
    merged.filter(u => u.uplift_score > 0.05).length, [merged]);

  async function fetchExplain(msno) {
    setLoading(true);
    setExplanation(null);
    try {
      const resp = await fetch(`${API}/users/churn-risk?msno=${encodeURIComponent(msno)}`);
      if (resp.ok) setExplanation(await resp.json());
      else setExplanation({ error: `User not found or API error (${resp.status})` });
    } catch(e) {
      setExplanation({ error: 'API unavailable. Make sure FastAPI is running.' });
    }
    setLoading(false);
  }

  const actionEmoji = {
    personal_outreach:       '📞',
    discount_offer:          '💰',
    feature_highlight_email: '✉️',
    re_onboarding_flow:      '🔄',
    no_action:               '—',
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Retention <span>Action Plan</span></div>
          <div className="page-sub">High-risk users ranked by churn probability</div>
        </div>
      </div>

      {/* KPIs */}
      <div className="kpi-row">
        <div className="kpi-card danger">
          <div className="kpi-label">High Risk Users</div>
          <div className="kpi-value" style={{color:'var(--danger)'}}>{fmtNum(merged.length)}</div>
          <div className="kpi-sub">churn_flag = 1</div>
        </div>
        <div className="kpi-card warning">
          <div className="kpi-label">Persuadable</div>
          <div className="kpi-value" style={{color:'var(--warning)'}}>{fmtNum(persuadable)}</div>
          <div className="kpi-sub">uplift &gt; 0.05</div>
        </div>
        <div className="kpi-card accent">
          <div className="kpi-label">Avg Churn Prob</div>
          <div className="kpi-value" style={{color:'var(--accent)'}}>
            {merged.length ? fmtPct(merged.reduce((s,u) => s + u.churn_prob, 0) / merged.length) : '—'}
          </div>
          <div className="kpi-sub">high-risk cohort</div>
        </div>
        <div className="kpi-card success">
          <div className="kpi-label">Total Users</div>

      <div className="grid-2">

                  </div>
                  <div className="bar-val">{fmtNum(count)}</div>

          </div>

      {/* Table */}
      <div className="card">
        <div className="card-title">Top High-Risk Users</div>

        <div className="filters">
          <select value={tierFilter} onChange={e => { setTierFilter(e.target.value); setPage(0); }}>
            {tiers.map(t => <option key={t}>{t}</option>)}
          </select>
          <select value={cohortFilter} onChange={e => { setCohortFilter(e.target.value); setPage(0); }}>
            {cohorts.map(c => <option key={c}>{c}</option>)}
          </select>
          <span style={{fontSize:11, color:'var(--muted)', marginLeft:'auto'}}>
            {fmtNum(filtered.length)} users
          </span>
        </div>

        <div className="table-wrap scrollable">
          <table>
            <thead>
              <tr>
                <th>User ID</th>
                <th>Churn Prob</th>
                <th>Risk Tier</th>
                <th>Cohort</th>
                <th>Uplift</th>
                <th>Tenure</th>
                <th>Sessions 30d</th>
                <th>Tickets 30d</th>
              </tr>
            </thead>
            <tbody>
              {pageData.map(u => (
                <tr key={u.msno} onClick={() => setSelectedMsno(u.msno)}>
                  <td><div className="msno-cell" title={u.msno}>{u.msno}</div></td>
                  <td><ProbBar value={u.churn_prob} /></td>
                  <td><RiskBadge tier={u.risk_tier} /></td>
                  <td><span style={{fontSize:10, color:'var(--muted)'}}>{u.behavioral_cohort || '—'}</span></td>
                  <td>
                    <span style={{color: u.uplift_score > 0.05 ? 'var(--success)' : 'var(--muted)', fontSize:11}}>
                      {fmt(u.uplift_score, 3)}
                    </span>
                  </td>
                  <td style={{fontSize:11, color:'var(--muted)'}}>{u.tenure_days ? `${u.tenure_days}d` : '—'}</td>
                  <td style={{fontSize:11}}>{u.sessions_last_30d ?? '—'}</td>
                  <td style={{fontSize:11, color: u.ticket_count_30d > 2 ? 'var(--danger)' : 'var(--text)'}}>
                    {u.ticket_count_30d ?? '—'}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {totalPages > 1 && (
          <div className="pagination">
            <span className="page-info">{page*PAGE_SIZE+1}–{Math.min((page+1)*PAGE_SIZE, filtered.length)} of {fmtNum(filtered.length)}</span>
            <button className="page-btn" onClick={() => setPage(p => Math.max(0, p-1))} disabled={page===0}>←</button>
            {[...Array(Math.min(5, totalPages))].map((_,i) => {
              const p = Math.max(0, Math.min(page-2, totalPages-5)) + i;
              return <button key={p} className={`page-btn${p===page?' active':''}`} onClick={() => setPage(p)}>{p+1}</button>;
            })}

          </div>

      </div>

      {/* Explain panel */}
      <div className="card" style={{marginTop:20}}>
        <div className="card-title">Live User Explanation</div>
        <div style={{display:'flex', gap:12, alignItems:'center'}}>
          <input
            type="text"
            value={selectedMsno}
            onChange={e => setSelectedMsno(e.target.value)}
            placeholder="Click a row or paste msno here..."
            style={{flex:1}}
          />
          <button className="btn btn-primary" onClick={() => fetchExplain(selectedMsno)} disabled={!selectedMsno || loading}>
            {loading ? 'Asking Grok...' : 'Explain →'}
          </button>
          {explanation && <button className="btn btn-ghost" onClick={() => setExplanation(null)}>Clear</button>}
        </div>

        {loading && <div className="loading"><div className="spinner" /> Generating explanation via Grok...</div>}

        {explanation && !loading && (
          explanation.error ? (
            <div style={{padding:'20px', color:'var(--danger)', fontSize:12, marginTop:16}}>{explanation.error}</div>

            <div className="explain-panel">

                <div>
                  <div className="explain-label">Why this user is at risk</div>
                  <div className="explain-text">{explanation.explanation}</div>

                  <div className="action-box">
                    <div style={{fontSize:10, color:'var(--success)', letterSpacing:'1.5px', textTransform:'uppercase', marginBottom:6}}>Recommended Action</div>
                    <div className="action-name">
                      {actionEmoji[explanation.recommended_action]} {(explanation.recommended_action||'').replace(/_/g,' ').toUpperCase()}

                    <div className="action-just">{explanation.action_justification}</div>
                  </div>
                </div>

                <div>
                  <div className="explain-label">Top Risk Factors (SHAP)</div>
                  {(explanation.top_risk_factors||[]).map((f,i) => (
                    <div key={i} className="shap-row">
                      <span className={`shap-dir-${f.direction==='risk_increase'?'up':'down'}`}>
                        {f.direction==='risk_increase' ? '↑' : '↓'}
                      </span>
                      <span className="shap-feat">{(f.feature||'').replace(/_/g,' ')}</span>
                      <span className="shap-val" style={{color: f.direction==='risk_increase'?'var(--danger)':'var(--success)'}}>
                        {fmt(f.shap_value, 4)}

                  ))}

                  <div style={{marginTop:16, display:'flex', flexDirection:'column', gap:8}}>
                    <div style={{display:'flex', justifyContent:'space-between', fontSize:11}}>
                      <span style={{color:'var(--muted)'}}>Churn Probability</span>
                      <span style={{color: probColor(explanation.churn_probability), fontWeight:600}}>
                        {fmtPct(explanation.churn_probability)}
                      </span>
                    </div>
                    <div style={{display:'flex', justifyContent:'space-between', fontSize:11}}>
                      <span style={{color:'var(--muted)'}}>Uplift Score</span>
                      <span style={{color: explanation.uplift_score > 0.05 ? 'var(--success)' : 'var(--danger)'}}>
                        {fmt(explanation.uplift_score, 3)}
                        <span style={{color:'var(--muted)', fontSize:10, marginLeft:4}}>
                          {explanation.uplift_score > 0.05 ? '(persuadable)' : '(not persuadable)'}
                        </span>
                      </span>
                    </div>
                    {explanation.change_point_detected && (
                      <div style={{fontSize:11, color:'var(--warning)', marginTop:4}}>
                        ⚡ Behavior shifted on {explanation.change_point_date}
                      </div>
                    )}

              </div>
            </div>
          )
        )}
      </div>
    </div>
  );
}

// PAGE 2 — MODEL INSIGHTS
// ══════════════════════════════════════════════════════════════════════════════

function ModelInsights({ scored, features }) {
  const merged = useMemo(() => {
    const featMap = {};
    features.forEach(f => { featMap[f.msno] = f; });
    return scored.map(u => ({ ...u, ...(featMap[u.msno] || {}) }));
  }, [scored, features]);

  // Churn prob histogram
  const histogram = useMemo(() => {
    const bins = Array(20).fill(0);
    scored.forEach(u => {
      const i = Math.min(19, Math.floor((u.churn_prob || 0) * 20));
      bins[i]++;
    });
    return bins;
  }, [scored]);

  const maxHist = Math.max(...histogram);

  // SHAP importance
  const shapImportance = useMemo(() => {
    const shap_cols = Object.keys(scored[0] || {}).filter(k => k.startsWith('shap_'));
    if (!shap_cols.length) return [];
    const sums = {};
    let count = 0;
    scored.forEach(u => {
      const hasSHAP = shap_cols.some(c => u[c] != null);
      if (!hasSHAP) return;
      count++;
      shap_cols.forEach(c => { sums[c] = (sums[c] || 0) + Math.abs(u[c] || 0); });
    });
    if (!count) return [];
    return Object.entries(sums)
      .map(([k, v]) => ({ feature: k.replace('shap_','').replace(/_/g,' '), value: v/count }))
      .sort((a,b) => b.value - a.value)
      .slice(0, 12);
  }, [scored]);

  const maxShap = shapImportance[0]?.value || 1;

  // Uplift distribution
  const upliftBuckets = useMemo(() => {
    const buckets = [
      { label: '< -0.1',      min:-Infinity, max:-0.1,  count:0 },
      { label: '-0.1 to 0',   min:-0.1,      max:0,     count:0 },
      { label: '0 to 0.05',   min:0,         max:0.05,  count:0 },
      { label: '0.05 to 0.1', min:0.05,      max:0.1,   count:0 },
      { label: '> 0.1',       min:0.1,       max:Infinity,count:0},
    ];
    scored.forEach(u => {
      if (u.uplift_score == null) return;
      const b = buckets.find(b => u.uplift_score >= b.min && u.uplift_score < b.max);
      if (b) b.count++;
    });
    return buckets;
  }, [scored]);

  const maxUplift = Math.max(...upliftBuckets.map(b => b.count));

  // Cohort churn rate
  const cohortStats = useMemo(() => {
    const m = {};
    merged.forEach(u => {
      const c = u.behavioral_cohort || 'unknown';
      if (!m[c]) m[c] = { total:0, churned:0 };
      m[c].total++;
      if (u.churn_flag) m[c].churned++;
    });
    return Object.entries(m)
      .map(([cohort, s]) => ({ cohort, rate: s.churned/s.total, total: s.total }))
      .sort((a,b) => b.rate - a.rate);
  }, [merged]);

  const maxCohortRate = Math.max(...cohortStats.map(c => c.rate));

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Model <span>Insights</span></div>
          <div className="page-sub">SHAP feature importance · uplift diagnostics · cohort analysis</div>
        </div>
      </div>

      {/* Performance KPIs */}
      <div className="kpi-row">
        <div className="kpi-card accent">
          <div className="kpi-label">AUC-ROC</div>
          <div className="kpi-value" style={{color:'var(--accent)'}}>0.9148</div>
          <div className="kpi-sub">5-fold CV</div>
        </div>
        <div className="kpi-card success">
          <div className="kpi-label">AUC-PR</div>
          <div className="kpi-value" style={{color:'var(--success)'}}>0.7039</div>
          <div className="kpi-sub">imbalanced classes</div>
        </div>
        <div className="kpi-card warning">
          <div className="kpi-label">Churn Rate</div>
          <div className="kpi-value" style={{color:'var(--warning)'}}>9.5%</div>
          <div className="kpi-sub">scale_pos_weight = 15</div>
        </div>
        <div className="kpi-card accent">
          <div className="kpi-label">Training Size</div>
          <div className="kpi-value" style={{color:'var(--accent3)'}}>860K</div>
          <div className="kpi-sub">labelled users</div>
        </div>
      </div>

      <div className="grid-2">
        {/* Churn prob histogram */}
        <div className="card">
          <div className="card-title">Churn Probability Distribution</div>
          <div className="hist-wrap">
            {histogram.map((count, i) => (
              <div
                key={i}
                className="hist-bar"
                style={{
                  height: `${(count/maxHist)*100}%`,
                  background: i >= 13 ? 'var(--danger)' : i >= 10 ? 'var(--warning)' : 'var(--accent3)',
                }}
                title={`${(i*5)}–${(i+1)*5}%: ${fmtNum(count)} users`}
              />
            ))}
          </div>
          <div style={{display:'flex', justifyContent:'space-between', fontSize:10, color:'var(--muted)', marginTop:6, padding:'0 4px'}}>
            <span>0%</span>
            <span style={{color:'var(--danger)'}}>← threshold 65%</span>
            <span>100%</span>
          </div>
        </div>

        {/* Cohort churn rate */}
        <div className="card">
          <div className="card-title">Churn Rate by Behavioral Cohort</div>
          <div className="bar-chart">
            {cohortStats.map(({ cohort, rate, total }) => (
              <div key={cohort} className="bar-row">
                <div className="bar-label" style={{fontSize:10}}>{cohort}</div>
                <div className="bar-track">
                  <div className="bar-fill" style={{
                    width: `${(rate/maxCohortRate)*100}%`,
                    background: rate > 0.3 ? 'linear-gradient(90deg,var(--danger),var(--accent2))' : 'linear-gradient(90deg,var(--accent3),var(--accent))'
                  }} />
                </div>
                <div className="bar-val">{fmtPct(rate)}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="grid-2">
        {/* SHAP importance */}
        <div className="card">
          <div className="card-title">SHAP Feature Importance</div>
          {shapImportance.length === 0 ? (
            <div className="empty">Run scoring pipeline to compute SHAP values</div>
          ) : (
            <div className="bar-chart">
              {shapImportance.map(({ feature, value }) => (
                <div key={feature} className="bar-row">
                  <div className="bar-label" style={{fontSize:10}}>{feature}</div>
                  <div className="bar-track">
                    <div className="bar-fill" style={{width:`${(value/maxShap)*100}%`}} />
                  </div>
                  <div className="bar-val" style={{fontSize:10}}>{fmt(value, 3)}</div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Uplift distribution */}
        <div className="card">
          <div className="card-title">Uplift Score Distribution</div>
          <div style={{fontSize:11, color:'var(--muted)', marginBottom:16}}>
            T-learner: incremental treatment effect — positive = worth contacting
          </div>
          <div className="uplift-dist">
            {upliftBuckets.map(b => (
              <div key={b.label} className="uplift-row">
                <div className="uplift-label">{b.label}</div>
                <div className="uplift-track">
                  <div
                    className={b.min >= 0 ? 'uplift-fill-pos' : 'uplift-fill-neg'}
                    style={{width: `${(b.count/maxUplift)*100}%`}}
                  />
                </div>
                <div className="uplift-count">{fmtNum(b.count)}</div>
              </div>
            ))}
          </div>
          <div style={{marginTop:20, padding:'12px 16px', background:'var(--surface2)', borderRadius:6, fontSize:11}}>
            <div style={{color:'var(--success)', marginBottom:4}}>
              ✓ Persuadable (uplift &gt; 0.05): <strong>{fmtNum(scored.filter(u => u.uplift_score > 0.05).length)}</strong>
            </div>
            <div style={{color:'var(--muted)'}}>
              Only these users receive interventions — saving outreach budget on non-persuadable users
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// PAGE 3 — MONITORING
// ══════════════════════════════════════════════════════════════════════════════

function Monitoring({ scored, features }) {
  const [drift,    setDrift]    = useState(null);
  const [loading,  setLoading]  = useState(false);
  const [retrained, setRetrained] = useState(false);

  async function fetchDrift() {
    setLoading(true);
    try {
      const resp = await fetch(`${API}/monitoring/drift-report`);
      if (resp.ok) setDrift(await resp.json());
      else setDrift({ error: `API error ${resp.status}` });
    } catch {
      setDrift({ error: 'API unavailable. Make sure FastAPI is running on :8000' });
    }
    setLoading(false);
  }

  useEffect(() => { fetchDrift(); }, []);

  // Feature distribution comparison
  const featureStats = useMemo(() => {
    const numCols = ['usage_decay_30d','sessions_last_30d','login_days_last_30d',
                     'ticket_count_30d','pct_negative_sentiment','uplift_score',
                     'days_since_last_login','payment_failure_count_90d'];
    return numCols.map(col => {
      const vals = scored.map(u => u[col]).filter(v => v != null && !isNaN(v));
      if (!vals.length) return null;
      vals.sort((a,b) => a-b);
      return {
        col,
        mean: vals.reduce((s,v) => s+v, 0) / vals.length,
        p50:  vals[Math.floor(vals.length * 0.5)],
        p95:  vals[Math.floor(vals.length * 0.95)],
        count: vals.length,
      };
    }).filter(Boolean);
  }, [scored]);

  const driftOk = drift && !drift.error && !drift.dataset_drift_detected;

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">System <span>Monitoring</span></div>
          <div className="page-sub">Feature drift · data health · retraining status</div>
        </div>
        <button className="btn btn-ghost" onClick={fetchDrift} disabled={loading}>
          {loading ? 'Checking...' : '↻ Refresh'}
        </button>
      </div>

      {/* Drift status banner */}
      <div className="drift-status">
        {loading ? (
          <><div className="spinner" /><div className="drift-label">Checking drift...</div></>
        ) : drift?.error ? (
          <><div className="status-dot danger" /><div><div className="drift-label">API Unavailable</div><div className="drift-sub">{drift.error}</div></div></>
        ) : drift ? (
          <>
            <div className={`status-dot ${driftOk ? 'ok' : 'warn'}`} />
            <div>
              <div className="drift-label">
                {driftOk ? 'No Significant Drift Detected' : 'Feature Drift Detected'}
              </div>
              <div className="drift-sub">
                {drift.drifted_features}/{drift.total_features} features drifted ({(drift.drift_share*100).toFixed(1)}%)
              </div>
            </div>
            {drift.retraining_recommended && (
              <button
                className="retrain-btn"
                onClick={() => setRetrained(true)}
              >
                {retrained ? '✓ Retraining Queued' : '⚡ Trigger Retraining'}
              </button>
            )}
          </>
        ) : null}
      </div>

      {/* Drift metrics */}
      {drift && !drift.error && (
        <div className="grid-3" style={{marginBottom:24}}>
          <div className="kpi-card accent">
            <div className="kpi-label">Features Drifted</div>
            <div className="kpi-value" style={{color: drift.drifted_features > 0 ? 'var(--warning)' : 'var(--success)'}}>
              {drift.drifted_features}
            </div>
            <div className="kpi-sub">of {drift.total_features} total</div>
          </div>
          <div className="kpi-card warning">
            <div className="kpi-label">Drift Share</div>
            <div className="kpi-value" style={{color: drift.drift_share > 0.2 ? 'var(--danger)' : 'var(--success)'}}>
              {(drift.drift_share * 100).toFixed(1)}%
            </div>
            <div className="kpi-sub">threshold: 20%</div>
          </div>
          <div className="kpi-card success">
            <div className="kpi-label">Retraining</div>
            <div className="kpi-value" style={{color: drift.retraining_recommended ? 'var(--danger)' : 'var(--success)'}}>
              {drift.retraining_recommended ? 'Needed' : 'Not Needed'}
            </div>
            <div className="kpi-sub">PSI-based detection</div>
          </div>
        </div>
      )}

      {/* Feature statistics table */}
      <div className="card">
        <div className="card-title">Current Feature Statistics</div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Feature</th>
                <th>Mean</th>
                <th>Median (p50)</th>
                <th>p95</th>
                <th>Non-null Count</th>
              </tr>
            </thead>
            <tbody>
              {featureStats.map(s => (
                <tr key={s.col}>
                  <td style={{fontSize:11}}>{s.col.replace(/_/g,' ')}</td>
                  <td style={{color:'var(--accent)', fontSize:11}}>{fmt(s.mean, 3)}</td>
                  <td style={{fontSize:11}}>{fmt(s.p50, 3)}</td>
                  <td style={{fontSize:11}}>{fmt(s.p95, 3)}</td>
                  <td style={{color:'var(--muted)', fontSize:11}}>{fmtNum(s.count)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Pipeline health */}
      <div className="card" style={{marginTop:20}}>
        <div className="card-title">Pipeline Health</div>
        <div style={{display:'flex', flexDirection:'column', gap:12}}>
          {[
            { label: 'Feature Pipeline',    file:'features_score.csv',   status:'ok' },
            { label: 'Churn Model',         file:'churn_classifier.pkl', status:'ok' },
            { label: 'Uplift Model',        file:'uplift_treatment.pkl', status:'ok' },
            { label: 'Scoring Pipeline',    file:'scored_users.csv',     status:'ok' },
            { label: 'Change Point (PELT)', file:'change_points.csv',    status: scored.some(u => u.change_point_detected) ? 'ok' : 'warn' },
          ].map(item => (
            <div key={item.label} style={{display:'flex', alignItems:'center', gap:12, padding:'10px 16px', background:'var(--surface2)', borderRadius:6}}>
              <div className={`status-dot ${item.status}`} />
              <div style={{flex:1}}>
                <div style={{fontSize:12}}>{item.label}</div>
                <div style={{fontSize:10, color:'var(--muted)', marginTop:2, fontFamily:'var(--font-mono)'}}>{item.file}</div>
              </div>
              <div style={{fontSize:10, color: item.status === 'ok' ? 'var(--success)' : 'var(--warning)', letterSpacing:'1px', textTransform:'uppercase'}}>
                {item.status === 'ok' ? 'Ready' : 'Optional'}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ROOT APP
// ══════════════════════════════════════════════════════════════════════════════

function App() {
  const [page,     setPage]     = useState('action');
  const [scored,   setScored]   = useState([]);
  const [features, setFeatures] = useState([]);
  const [loading,  setLoading]  = useState(true);

  useEffect(() => {
    async function load() {
      setLoading(true);
      const [s, f] = await Promise.all([
        loadCSV('scored_users.csv', 2000),
        loadCSV('features_score.csv', 2000),
      ]);
      setScored(s);
      setFeatures(f);
      setLoading(false);
    }
    load();
  }, []);

  const totalUsers  = scored.length;
  const highRisk    = scored.filter(u => u.churn_flag === 1 || u.churn_flag === true).length;
  const churnRate   = totalUsers ? (highRisk / totalUsers * 100).toFixed(1) : '—';

  const navItems = [
    { id: 'action',    icon: '⚡', label: 'Action Plan'    },
    { id: 'insights',  icon: '◈',  label: 'Model Insights' },
    { id: 'monitor',   icon: '◉',  label: 'Monitoring'     },
  ];

  return (
    <div className="shell">
      <nav className="sidebar">
        <div className="sidebar-logo">
          <h1>Churn<br/>Sense</h1>
          <span></span>
        </div>

        {navItems.map(n => (
          <div
            key={n.id}
            className={`nav-item${page === n.id ? ' active' : ''}`}
            onClick={() => setPage(n.id)}
          >
            <span className="nav-icon">{n.icon}</span>
            {n.label}
          </div>
        ))}

        <div className="sidebar-stats">
          <div className="stat-pill">
            <span className="stat-pill-label">Total Users</span>
            <span className="stat-pill-value">{fmtNum(totalUsers)}</span>
          </div>
          <div className="stat-pill">
            <span className="stat-pill-label">High Risk</span>
            <span className="stat-pill-value" style={{color:'var(--danger)'}}>{fmtNum(highRisk)}</span>
          </div>
          <div className="stat-pill">
            <span className="stat-pill-label">Churn Rate</span>
            <span className="stat-pill-value">{churnRate}%</span>
          </div>
        </div>
      </nav>

      <main className="main">
        {loading ? (
          <div className="loading" style={{height:'100vh'}}>
            <div className="spinner" />
            Loading data...
          </div>
        ) : (
          <>
            {page === 'action'   && <ActionPlan    scored={scored} features={features} />}
            {page === 'insights' && <ModelInsights scored={scored} features={features} />}
            {page === 'monitor'  && <Monitoring    scored={scored} features={features} />}
          </>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
